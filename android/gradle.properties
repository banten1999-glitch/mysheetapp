org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:CICompilerCount=2 -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvm.options=-Xmx1024m -XX:CICompilerCount=2
# This machine currently has very little free RAM alongside other running
# apps, so keep the build single-threaded to avoid multiple concurrent JVMs
# competing for memory (was causing native OOM crashes at higher settings).
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=false
# Disabled: the project (E:\) and the pub/Gradle package caches (C:\) live on
# different drive letters, and Kotlin's incremental-compilation cache cannot
# compute a relative path across drives on Windows, which crashes every
# plugin's compileDebugKotlin task. This only costs a slightly slower full
# recompile each time - safe to re-enable if the project is later moved to
# the same drive as the Gradle/pub caches (normally under the user profile).
kotlin.incremental=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
