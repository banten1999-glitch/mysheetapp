# App icon generation from the MS logo.
# Regenerate after changing assets/images/logo.png with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/images/logo.png"

  android: "ic_launcher"
  # The source PNG is transparent, so pad it onto a white plate rather than
  # letting the launcher composite it over an arbitrary background.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"
  min_sdk_android: 24

  ios: true
  # iOS rejects icons with an alpha channel - flatten onto white.
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
