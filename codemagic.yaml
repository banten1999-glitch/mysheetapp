workflows:
  ios-ipa:
    name: Hasnawi Ledger - iOS IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      # Manual signing: upload your existing .p12 certificate and
      # .mobileprovision profile once under the app's "Code signing
      # identities" page in Codemagic, giving each a reference name - use
      # those names below (replace the placeholders). No Apple Developer
      # account access or API key is needed with this method.
      ios_signing:
        provisioning_profiles:
          - mysheetapp_profile
        certificates:
          - mysheetapp_cert
      # Create a group named "google_config" under Environment variables in
      # the Codemagic app settings, and add these three *secret* variables
      # to it (never commit their values here):
      #   GOOGLE_SERVER_CLIENT_ID        Web OAuth client ID
      #   GOOGLE_IOS_CLIENT_ID           iOS OAuth client ID
      #   GOOGLE_IOS_REVERSED_CLIENT_ID  same client ID, segments reversed
      # See README.md, "iOS / IPA" section, for how to obtain each one.
      groups:
        - google_config
      vars:
        BUNDLE_ID: "com.hasnawi.mysheetapp"
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up code signing
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Inject Google Sign-In URL scheme into Info.plist
        script: |
          if [ -z "$GOOGLE_IOS_REVERSED_CLIENT_ID" ]; then
            echo "GOOGLE_IOS_REVERSED_CLIENT_ID is not set - add it under Environment variables. See README.md."
            exit 1
          fi
          sed -i '' "s/__GOOGLE_IOS_REVERSED_CLIENT_ID__/$GOOGLE_IOS_REVERSED_CLIENT_ID/" ios/Runner/Info.plist
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID" \
            --dart-define=GOOGLE_IOS_CLIENT_ID="$GOOGLE_IOS_CLIENT_ID"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
